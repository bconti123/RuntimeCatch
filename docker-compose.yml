services:
  postgres:
    image: postgres:16-alpine
    container_name: runtimecatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: runtimecatch
      POSTGRES_PASSWORD: runtimecatch
      POSTGRES_DB: runtimecatch
    ports:
      # Host side is configurable (POSTGRES_HOST_PORT, default 5435 to dodge
      # system Postgres on 5432-5434); the container always listens on 5432.
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - runtimecatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtimecatch -d runtimecatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: runtimecatch-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # Docker-internal database URL: inside the compose network the DB is
      # reached at the *service name* `postgres` on the internal port 5432 —
      # never `localhost`, never POSTGRES_HOST_PORT (that mapping only exists
      # on the host). This deliberately overrides any DATABASE_URL in .env.
      DATABASE_URL: postgresql://runtimecatch:runtimecatch@postgres:5432/runtimecatch?schema=public
      # Forward-compat placeholder. Not consumed by the current auth code
      # (sessions are opaque tokens stored in Postgres), but reserved so the
      # Docker setup already exposes it when auth gains a signing key.
      SESSION_SECRET: local-dev-session-secret-change-me
    ports:
      # Host side is configurable (WEB_PORT, default 3000); the dev server
      # always listens on 3000 inside the container.
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Bind-mount source for live reload.
      - .:/app
      # Named volumes shadow the bind mount for paths that must stay
      # container-local: node_modules has musl/glibc + Linux/macOS skew
      # against the host, .next is a build cache, prisma/generated is
      # produced by `prisma generate` inside the image.
      - runtimecatch-node-modules:/app/node_modules
      - runtimecatch-next-cache:/app/.next
      - runtimecatch-prisma-generated:/app/prisma/generated

volumes:
  runtimecatch-pgdata:
  runtimecatch-node-modules:
  runtimecatch-next-cache:
  runtimecatch-prisma-generated:
