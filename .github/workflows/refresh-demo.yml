name: Refresh demo data

# Keeps the live demo dashboard looking active. The simulate script is
# additive (it only inserts new runtime events with current timestamps for
# the demo services — it never deletes), so this is safe to run on a
# schedule even if real data ever lands in the database.

on:
  schedule:
    # Every 12 hours (00:00 and 12:00 UTC). The dashboard only shows the last
    # 24 hours, so a 12h cadence keeps it populated with margin: a single
    # missed/failed run still leaves the next one inside the window.
    - cron: "0 */12 * * *"
  # Allow running on demand from the Actions tab.
  workflow_dispatch: {}

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # prisma.config.ts throws if DATABASE_URL is unset, and `npm ci` runs
      # `prisma generate` via postinstall — so the var must be present here too.
      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}

      - name: Inject 2 min of fresh demo events
        run: npm run simulate
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          SIMULATE_DURATION_MS: "120000"
